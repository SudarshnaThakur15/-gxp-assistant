[project]
name = "gxp-api"
version = "0.1.0"
description = "GxP Knowledge Assistant API: retrieval, assurance layer, audit trail"
authors = [
    { name = "Sudarshna Thakur", email = "thakursudarshna2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "groq>=1.7.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
