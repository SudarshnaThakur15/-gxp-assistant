# Render blueprint for the API (the web app is on Vercel). Secrets are set in the Render dashboard.
services:
  - type: web
    name: gxp-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: api
    buildCommand: pip install uv && uv sync --frozen --no-dev && uv run python -c "from app.embedding import embed_query; embed_query('warm-up')"
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: API_SHARED_KEY
        sync: false
